<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000" height="72" viewBox="0 0 1000 72" fill="none"
>
  <style>
    .star {
      fill: #E5A9C3;
      animation: twinkle 3.6s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.14; }
      50%      { opacity: 0.85; }
    }

    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: 0.6; }
    }

    @media (prefers-color-scheme: dark) {
      @keyframes twinkle {
        0%, 100% { opacity: 0.18; }
        50%      { opacity: 1; }
      }
    }
  </style>

  <g>
    <circle class="star" cx="21" cy="30" r="1.3" style="animation-delay: 2.0s" />
    <circle class="star" cx="49" cy="14" r="1.7" style="animation-delay: 3.0s" />
    <circle class="star" cx="99" cy="31" r="1.1" style="animation-delay: 0.5s" />
    <circle class="star" cx="135" cy="29" r="1.7" style="animation-delay: 3.4s" />
    <circle class="star" cx="163" cy="64" r="1.1" style="animation-delay: 2.8s" />
