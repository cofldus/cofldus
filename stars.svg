    <circle class="star" cx="371" cy="37" r="1.7" style="animation-delay: 3.3s" />
    <circle class="star" cx="412" cy="23" r="1.7" style="animation-delay: 3.5s" />
    <circle class="star" cx="446" cy="22" r="1.1" style="animation-delay: 1.5s" />
