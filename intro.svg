<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="150"
  viewBox="0 0 1000 150"
>
  <style>
    .title {
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 38px;
      font-weight: 600;
      fill: #24292f;
    }

    .subtitle {
      font-family: "Courier New", monospace;
      font-size: 25px;
      font-style: italic;
      fill: #57606a;
    }

    .face {
      font-family: Arial, sans-serif;
      font-size: 22px;
      fill: #57606a;
    }

    @media (prefers-color-scheme: dark) {
      .title {
        fill: #c9d1d9;
      }

      .subtitle,
      .face {
        fill: #8b949e;
      }
    }
  </style>

  <text
    x="500"
    y="48"
    text-anchor="middle"
    class="title"
  >
    Welcome to my little orbit,
  </text>

  <text
    x="500"
    y="92"
    text-anchor="middle"
    class="subtitle"
  >
    where ideas compile into constellations. ✦
  </text>

  <text
    x="500"
    y="130"
    text-anchor="middle"
    class="face"
  >
    (*˙︶˙*)و
  </text>
</svg>
