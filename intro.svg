<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000" height="104" viewBox="0 0 1000 104" fill="none"
>
  <style>
    /* 임베드 폰트 없이 시스템 서체를 쓴다. GitHub README 본문과 같은 스택이라
       배너와 그 아래 글이 한 서체로 이어진다. 문구를 바꿔도 손볼 게 없다. */
    .name, .role {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans",
                   Helvetica, Arial, sans-serif;
    }
    .name { font-size: 32px; font-weight: 300; letter-spacing: -0.2px; fill: #1f2328; }
    .role { font-size: 15px; font-weight: 400; letter-spacing: 0.6px; fill: #5b636e; }

    .star { fill: #E5A9C3; animation: twinkle 3.6s ease-in-out infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.16; }
      50%      { opacity: 0.9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: 0.65; }
    }

    @media (prefers-color-scheme: dark) {
      .name { fill: #e6edf3; }
      .role { fill: #9aa4b2; }
    }
  </style>

  <g>
    <circle class="star" cx="612" cy="31" r="1.5" style="animation-delay: 0.0s" />
    <circle class="star" cx="668" cy="60" r="1.1" style="animation-delay: 0.6s" />
    <circle class="star" cx="720" cy="23" r="1.3" style="animation-delay: 1.3s" />
    <circle class="star" cx="760" cy="77" r="1.0" style="animation-delay: 2.1s" />
    <circle class="star" cx="806" cy="42" r="1.4" style="animation-delay: 2.8s" />
    <circle class="star" cx="852" cy="69" r="1.0" style="animation-delay: 0.3s" />
    <circle class="star" cx="884" cy="19" r="1.2" style="animation-delay: 1.0s" />
    <circle class="star" cx="930" cy="54" r="1.6" style="animation-delay: 1.7s" />
    <circle class="star" cx="958" cy="83" r="1.0" style="animation-delay: 2.4s" />
    <circle class="star" cx="566" cy="89" r="1.1" style="animation-delay: 3.0s" />
    <circle class="star" cx="700" cy="94" r="1.0" style="animation-delay: 1.5s" />
    <circle class="star" cx="820" cy="96" r="1.2" style="animation-delay: 2.6s" />
    <circle class="star" cx="128" cy="12" r="1.0" style="animation-delay: 0.8s" />
    <circle class="star" cx="286" cy="9" r="1.1" style="animation-delay: 2.0s" />
    <circle class="star" cx="420" cy="14" r="0.9" style="animation-delay: 1.1s" />
    <circle class="star" cx="96" cy="94" r="1.0" style="animation-delay: 2.3s" />
    <circle class="star" cx="330" cy="97" r="0.9" style="animation-delay: 1.6s" />
  </g>

  <text x="64" y="50" class="name">Chaeyeon Lee</text>
  <text x="64" y="79" class="role">Retrieval, vision, and the evaluation pipelines that check them</text>
</svg>
