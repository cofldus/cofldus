<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000" height="114" viewBox="0 0 1000 114" fill="none"
>
  <style>
    /* Inter (SIL Open Font License 1.1) - 두 줄에 쓰인 글자만 남긴 서브셋 한 벌.
       img로 불러오는 SVG는 외부 폰트를 못 받으므로 data URI로 임베드한다. */
    @font-face {
      font-family: "Intro";
      font-weight: 200; font-style: normal;
      src: url(data:font/ttf;base64,) format("truetype");
    }

    .title, .subtitle {
      font-family: "Intro", -apple-system, "SF Pro Display",
                   "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
      font-weight: 200;
    }
    .title    { font-size: 36px; letter-spacing: 0.1px; fill: #1f2328; }
    .subtitle { font-size: 16px; letter-spacing: 0.3px; fill: #5b636e; }

    .star { fill: #E5A9C3; animation: twinkle 3.6s ease-in-out infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.16; }
      50%      { opacity: 0.9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: 0.65; }
    }

    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .subtitle { fill: #9aa4b2; }
    }
  </style>

  <g>
    <circle class="star" cx="58" cy="25" r="1.7" style="animation-delay: 0.0s" />
    <circle class="star" cx="112" cy="50" r="1.2" style="animation-delay: 0.6s" />
    <circle class="star" cx="46" cy="80" r="1.5" style="animation-delay: 1.3s" />
    <circle class="star" cx="140" cy="98" r="1.0" style="animation-delay: 2.1s" />
    <circle class="star" cx="168" cy="18" r="1.1" style="animation-delay: 2.8s" />
    <circle class="star" cx="942" cy="27" r="1.7" style="animation-delay: 0.3s" />
    <circle class="star" cx="888" cy="54" r="1.2" style="animation-delay: 1.0s" />
    <circle class="star" cx="954" cy="82" r="1.5" style="animation-delay: 1.7s" />
    <circle class="star" cx="860" cy="99" r="1.0" style="animation-delay: 2.4s" />
    <circle class="star" cx="832" cy="16" r="1.1" style="animation-delay: 3.0s" />
    <circle class="star" cx="286" cy="11" r="1.1" style="animation-delay: 1.5s" />
    <circle class="star" cx="452" cy="8" r="0.9" style="animation-delay: 2.6s" />
    <circle class="star" cx="648" cy="13" r="1.3" style="animation-delay: 0.8s" />
    <circle class="star" cx="742" cy="7" r="0.9" style="animation-delay: 2.0s" />
    <circle class="star" cx="372" cy="105" r="1.0" style="animation-delay: 1.1s" />
    <circle class="star" cx="612" cy="108" r="1.1" style="animation-delay: 2.3s" />
  </g>

  <text x="500" y="52" text-anchor="middle" class="title">Welcome to my little orbit,</text>
  <text x="500" y="89" text-anchor="middle" class="subtitle">where ideas compile into constellations. ✦</text>
</svg>
