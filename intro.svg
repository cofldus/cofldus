<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000" height="132" viewBox="0 0 1000 132" fill="none"
>
  <style>
    /* Inter (SIL Open Font License 1.1) - 쓰인 글자만 남긴 서브셋.
       img로 불러오는 SVG는 외부 폰트를 못 받으므로 data URI로 임베드한다. */
    @font-face {
      font-family: "IntroDisplay";
      font-weight: 200; font-style: normal;
      src: url(data:font/ttf;base64,) format("truetype");
    }
    @font-face {
      font-family: "IntroText";
      font-weight: 450; font-style: normal;
      src: url(data:font/ttf;base64,) format("truetype");
    }

    .title {
      font-family: "IntroDisplay", -apple-system, "SF Pro Display",
                   "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
      font-weight: 200; font-size: 42px; letter-spacing: 0.0px;
      fill: #1f2328;
    }
    .subtitle {
      font-family: "IntroText", -apple-system, "SF Pro Text",
                   "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
      font-weight: 450; font-size: 18px; letter-spacing: 0.35px;
      fill: #464e58;
    }
    .star { fill: #E5A9C3; animation: twinkle 3.6s ease-in-out infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.16; }
      50%      { opacity: 0.9; }
    }
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: 0.65; }
    }

    @media (prefers-color-scheme: dark) {
      .title { fill: #e6edf3; }
      .subtitle { fill: #adb7c4; }
    }
  </style>

  <g>
    <circle class="star" cx="58" cy="29" r="1.9" style="animation-delay: 0.0s" />
    <circle class="star" cx="112" cy="58" r="1.3" style="animation-delay: 0.6s" />
    <circle class="star" cx="46" cy="92" r="1.6" style="animation-delay: 1.3s" />
    <circle class="star" cx="140" cy="114" r="1.1" style="animation-delay: 2.1s" />
    <circle class="star" cx="168" cy="21" r="1.2" style="animation-delay: 2.8s" />
    <circle class="star" cx="942" cy="32" r="1.9" style="animation-delay: 0.3s" />
    <circle class="star" cx="888" cy="62" r="1.3" style="animation-delay: 1.0s" />
    <circle class="star" cx="954" cy="95" r="1.6" style="animation-delay: 1.7s" />
    <circle class="star" cx="860" cy="115" r="1.1" style="animation-delay: 2.4s" />
    <circle class="star" cx="832" cy="18" r="1.2" style="animation-delay: 3.0s" />
    <circle class="star" cx="286" cy="13" r="1.2" style="animation-delay: 1.5s" />
    <circle class="star" cx="452" cy="9" r="1.0" style="animation-delay: 2.6s" />
    <circle class="star" cx="648" cy="15" r="1.4" style="animation-delay: 0.8s" />
    <circle class="star" cx="742" cy="8" r="1.0" style="animation-delay: 2.0s" />
    <circle class="star" cx="372" cy="121" r="1.1" style="animation-delay: 1.1s" />
    <circle class="star" cx="612" cy="125" r="1.2" style="animation-delay: 2.3s" />
  </g>

  <text x="500" y="60" text-anchor="middle" class="title">Welcome to my little orbit,</text>
  <text x="500" y="103" text-anchor="middle" class="subtitle">where ideas compile into constellations. ✦</text>
</svg>
