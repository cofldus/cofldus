<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1000"
  height="190"
  viewBox="0 0 1000 190"
  fill="none"
>
  <defs>
    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse" x1="280" y1="0" x2="720" y2="0">
      <stop offset="0" stop-color="#E5A9C3" />
      <stop offset="0.5" stop-color="#BFA6E5" />
      <stop offset="1" stop-color="#A9C8E5" />
      <animate attributeName="x1" values="280;480;280" dur="9s" repeatCount="indefinite" />
      <animate attributeName="x2" values="720;920;720" dur="9s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#E5A9C3" stop-opacity="0" />
      <stop offset="0.5" stop-color="#BFA6E5" stop-opacity="0.85" />
      <stop offset="1"   stop-color="#A9C8E5" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#E5A9C3" stop-opacity="0.7" />
      <stop offset="1" stop-color="#E5A9C3" stop-opacity="0" />
    </radialGradient>

    <path id="moonPath" d="M 395 156 a 105 18 0 1 0 210 0 a 105 18 0 1 0 -210 0" />
  </defs>

  <style>
    /* Inter (SIL Open Font License 1.1) - 이 파일에 쓰인 글자만 남긴 서브셋.
       외부 요청 없이 data URI로 들어가므로 &lt;img&gt;로 불러도 그대로 렌더된다. */
    @font-face {
      font-family: "IntroDisplay";
      font-weight: 600;
      font-style: normal;
      src: url(data:font/ttf;base64,) format("truetype");
    }

    @font-face {
      font-family: "IntroText";
      font-weight: 400;
      font-style: normal;
      src: url(data:font/ttf;base64,) format("truetype");
    }

    .title {
      font-family: "IntroDisplay", -apple-system, "SF Pro Display",
                   "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
      font-size: 41px;
      font-weight: 600;
      letter-spacing: -0.9px;
      fill: url(#titleGrad);
    }

    .subtitle {
      font-family: "IntroText", -apple-system, "SF Pro Text",
                   "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
      font-size: 19px;
      font-weight: 400;
      letter-spacing: 0.15px;
      fill: #6e7781;
    }

    .face {
      font-family: "Segoe UI", -apple-system, Arial, sans-serif;
      font-size: 20px;
      fill: #6e7781;
    }

    .halo {
      stroke: #BFA6E5;
      stroke-width: 0.9;
      stroke-dasharray: 1.2 6;
      stroke-linecap: round;
      opacity: 0.38;
    }

    .star {
      fill: #E5A9C3;
      animation: twinkle 3.6s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.16; }
      50%      { opacity: 0.9; }
    }

    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: 0.65; }
    }

    @media (prefers-color-scheme: dark) {
      .subtitle, .face { fill: #8b949e; }
      .halo { opacity: 0.48; }
    }
  </style>

  <!-- 배경 별. 글자가 놓이는 가운데 띠는 비워둔다 -->
  <g>
    <circle class="star" cx="58"  cy="42"  r="1.9" style="animation-delay: 0s" />
    <circle class="star" cx="112" cy="78"  r="1.3" style="animation-delay: 0.6s" />
    <circle class="star" cx="46"  cy="126" r="1.6" style="animation-delay: 1.3s" />
    <circle class="star" cx="140" cy="152" r="1.1" style="animation-delay: 2.1s" />
    <circle class="star" cx="168" cy="34"  r="1.2" style="animation-delay: 2.8s" />
    <circle class="star" cx="942" cy="46"  r="1.9" style="animation-delay: 0.3s" />
    <circle class="star" cx="888" cy="84"  r="1.3" style="animation-delay: 1.0s" />
    <circle class="star" cx="954" cy="130" r="1.6" style="animation-delay: 1.7s" />
    <circle class="star" cx="860" cy="154" r="1.1" style="animation-delay: 2.4s" />
    <circle class="star" cx="832" cy="30"  r="1.2" style="animation-delay: 3.0s" />
    <circle class="star" cx="286" cy="20"  r="1.2" style="animation-delay: 1.5s" />
    <circle class="star" cx="452" cy="14"  r="1.0" style="animation-delay: 2.6s" />
    <circle class="star" cx="648" cy="22"  r="1.4" style="animation-delay: 0.8s" />
    <circle class="star" cx="742" cy="12"  r="1.0" style="animation-delay: 2.0s" />
  </g>

  <text x="500" y="72" text-anchor="middle" class="title">Welcome to my little orbit,</text>

  <rect x="300" y="90" width="400" height="1.4" rx="0.7" fill="url(#ruleGrad)" />

  <text x="500" y="121" text-anchor="middle" class="subtitle">where ideas compile into constellations. ✦</text>

  <!-- 얼굴 둘레의 작은 궤도와, 그 위를 도는 달 하나 -->
  <ellipse class="halo" cx="500" cy="156" rx="105" ry="18" />
  <text x="500" y="163" text-anchor="middle" class="face">(*˙︶˙*)و</text>

  <!-- SMIL이 없는 렌더러에서 달이 좌상단(0,0)에 박히지 않도록 opacity 0에서 켠다 -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="0s" fill="freeze" />
    <circle r="9" fill="url(#moonGlow)" />
    <circle r="2.8" fill="#E5A9C3" />
    <animateMotion dur="12s" repeatCount="indefinite">
      <mpath href="#moonPath" xlink:href="#moonPath" />
    </animateMotion>
  </g>
</svg>
