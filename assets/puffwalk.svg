<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-label="a tiny pink puffball playing">
  <style>
    .mover{animation:mv 8.5s ease-in-out infinite}
    .spin{transform-box:fill-box;transform-origin:50% 62%;animation:sp 8.5s ease-in-out infinite}
    .tilt{transform-box:fill-box;transform-origin:50% 100%;animation:tl 8.5s ease-in-out infinite}
    .hop{transform-box:fill-box;transform-origin:50% 100%;animation:hp 8.5s ease-in-out infinite}
    .arm-l{transform-box:fill-box;transform-origin:70% 20%;animation:al 1.5s ease-in-out infinite}
    .arm-r{transform-box:fill-box;transform-origin:30% 20%;animation:al 1.5s ease-in-out infinite .4s}
    .eye{transform-box:fill-box;transform-origin:50% 50%;animation:bk 3.2s ease-in-out infinite}
    .shadow{transform-box:fill-box;transform-origin:50% 50%;animation:sh 8.5s ease-in-out infinite}

    @keyframes mv{0%{transform:translateX(0)}18%{transform:translateX(30px)}34%{transform:translateX(30px)}52%{transform:translateX(16px)}74%{transform:translateX(0)}100%{transform:translateX(0)}}
    @keyframes hp{
      0%{transform:translateY(0) scale(1.12,.88)}
      5%{transform:translateY(-30%) scale(.96,1.08)}
      9%{transform:translateY(-52%) scale(1,1.02)}
      13%{transform:translateY(-24%) scale(1,1)}
      17%{transform:translateY(0) scale(1.12,.88)}
      22%{transform:translateY(-30%) scale(.96,1.08)}
      26%{transform:translateY(-52%) scale(1,1.02)}
      30%{transform:translateY(-24%) scale(1,1)}
      34%{transform:translateY(0) scale(1.1,.9)}
      37%{transform:translateY(0) scale(1,1)}
      71%{transform:translateY(0) scale(1,1)}
      75%{transform:translateY(-46%) scale(.97,1.06)}
      79%{transform:translateY(0) scale(1.1,.9)}
      83%{transform:translateY(-40%) scale(.98,1.05)}
      87%{transform:translateY(0) scale(1.12,.88)}
      91%{transform:translateY(0) scale(1,1)}
      100%{transform:translateY(0) scale(1.12,.88)}}
    @keyframes sp{0%,50%{transform:rotate(0)}59%{transform:rotate(360deg)}59.01%,100%{transform:rotate(0)}}
    @keyframes tl{0%,37%{transform:rotate(0)}41%{transform:rotate(-7deg)}47%{transform:rotate(6deg)}51%{transform:rotate(0)}62%{transform:rotate(0)}66%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}72%,100%{transform:rotate(0)}}
    @keyframes al{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-12deg)}}
    @keyframes bk{0%,42%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}47%{transform:scaleY(1)}}
    @keyframes sh{0%{transform:scale(1)}9%{transform:scale(.62)}17%{transform:scale(1)}26%{transform:scale(.62)}34%{transform:scale(1)}
      71%{transform:scale(1)}75%{transform:scale(.66)}79%{transform:scale(1)}83%{transform:scale(.68)}87%{transform:scale(1)}100%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <g class="mover">
    <g transform="translate(6,32) scale(0.58)">
      <ellipse class="shadow" cx="50" cy="99" rx="28" ry="4.5" fill="rgba(120,70,90,.16)"/>
      <g class="tilt"><g class="hop"><g class="spin">
        <ellipse class="arm-l" cx="12" cy="60" rx="8" ry="11" fill="#efa0bb"/>
        <ellipse class="arm-r" cx="88" cy="60" rx="8" ry="11" fill="#efa0bb"/>
        <ellipse cx="36" cy="90" rx="12" ry="8" fill="#d1587a"/>
        <ellipse cx="64" cy="90" rx="12" ry="8" fill="#d1587a"/>
        <circle cx="50" cy="52" r="40" fill="#f4a6c0"/>
        <ellipse cx="50" cy="66" rx="26" ry="20" fill="#fff" opacity=".26"/>
        <ellipse cx="26" cy="60" rx="9" ry="5.5" fill="#f27ba6" opacity=".85"/>
        <ellipse cx="74" cy="60" rx="9" ry="5.5" fill="#f27ba6" opacity=".85"/>
        <g class="eye">
          <ellipse cx="40" cy="46" rx="5.2" ry="11.5" fill="#3a2b46"/>
          <ellipse cx="40" cy="52" rx="3.6" ry="5.2" fill="#8fb7e8"/>
          <circle cx="41.6" cy="40.5" r="2.3" fill="#fff"/>
        </g>
        <g class="eye">
          <ellipse cx="60" cy="46" rx="5.2" ry="11.5" fill="#3a2b46"/>
          <ellipse cx="60" cy="52" rx="3.6" ry="5.2" fill="#8fb7e8"/>
          <circle cx="61.6" cy="40.5" r="2.3" fill="#fff"/>
        </g>
        <path d="M45 64 Q50 69 55 64" fill="none" stroke="#3a2b46" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      </g></g></g>
    </g>
  </g>
</svg>
