<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Lee Chaeyeon banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#231046" />
      <stop offset="55%" stop-color="#5A33AF" />
      <stop offset="100%" stop-color="#B59AE8" />
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)" rx="6" />
  <rect width="1280" height="340" fill="url(#grid)" rx="6" />
  <rect width="1280" height="340" filter="url(#noise)" opacity="0.45" />
  <line x1="160" y1="82" x2="1120" y2="82" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
  <line x1="140" y1="270" x2="1140" y2="270" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

  <g text-anchor="middle" fill="#F8F7FF" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="640" y="154" font-size="66" font-weight="800" letter-spacing="0.5">Lee Chaeyeon</text>
    <text x="640" y="200" font-size="30" font-weight="650" fill="#E9E1FF">AI / NLP Engineer</text>
    <rect x="405" y="220" width="470" height="1.5" fill="url(#divider)" />
    <text x="640" y="258" font-size="21" font-weight="500" fill="#EBE4FF" opacity="0.93">Building practical AI systems from data to deployment</text>
  </g>
</svg>
