name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: cofldus
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4f9e&color_dots=%23ffe3f0,%23ffb3d9,%23ff8fc0,%23f25ca2,%23c1266f
            dist/github-snake-dark.svg?color_snake=%23ff7fbf&color_dots=%232a1620,%236e2a4f,%23c94f92,%23ff8fc0,%23ffd0e6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
