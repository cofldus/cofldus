name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: cofldus
          outputs: |
            dist/github-snake.svg?color_snake=%23d98fb4&color_dots=%23fbeef5,%23f3d3e4,%23e9b3ce,%23dd93b5,%23cd7a9f
            dist/github-snake-dark.svg?color_snake=%23e3a6c4&color_dots=%23211a1e,%2343303a,%236f5060,%23a67e91,%23dcb6cb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
